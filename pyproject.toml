[project]
name = "isaacase"
version = "0.1.0"
description = "IsaacASE: A repro of ASE using IsaacLab and IsaacSim"
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
  "torch==2.7.0",
  "torchvision==0.22.0",
  'isaacsim[all,extscache]==5.0.0'
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
isaacsim = { index = "nvidia" }
